services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yah
      POSTGRES_PASSWORD: password
      POSTGRES_DB: yah
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-dev-db.sh:/docker-entrypoint-initdb.d/init-dev-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yah"]
      interval: 2s
      timeout: 5s
      retries: 10

  shlink:
    image: shlinkio/shlink:4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEFAULT_DOMAIN: localhost:8080
      IS_HTTPS_ENABLED: "false"
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: yah
      DB_PASSWORD: password
      DB_NAME: yah
      INITIAL_API_KEY: dev-api-key-12345
    ports:
      - "8080:8080"

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://yah:password@postgres:5432/umami
      APP_SECRET: dev-umami-secret
    ports:
      - "3001:3000"

  listmonk:
    image: listmonk/listmonk:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - ./config/listmonk-dev.toml:/listmonk/config.toml
    command: >
      sh -c "yes | ./listmonk --install --idempotent --config /listmonk/config.toml 2>&1 || true;
             ./listmonk --config /listmonk/config.toml"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
