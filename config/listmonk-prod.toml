[app]
address = "0.0.0.0:9000"

[db]
host = "postgres"
port = 5432
user = "listmonk"
database = "listmonk"
ssl_mode = "disable"
max_open = 25
max_idle = 25
max_lifetime = "300s"

# Password is set via LISTMONK_db__password environment variable in docker-compose.yml
# Listmonk's env var override format: LISTMONK_<section>__<key>
