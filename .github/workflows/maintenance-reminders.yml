name: Maintenance Reminders

on:
  schedule:
    # Quarterly: First day of Apr, Jul, Oct at 9am UTC
    - cron: '0 9 1 4,7,10 *'
    # Yearly: First day of January at 9am UTC
    - cron: '0 9 1 1 *'
  workflow_dispatch:

jobs:
  quarterly-reminder:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 1 4,7,10 *' || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Check outdated packages
        id: outdated
        run: |
          bun outdated --json > outdated.json 2>/dev/null || echo '{}' > outdated.json
          echo "outdated_json<<EOF" >> $GITHUB_OUTPUT
          cat outdated.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Quarterly Maintenance Issue
        uses: actions/github-script@v7
        with:
          script: |
            const quarter = Math.ceil((new Date().getMonth() + 1) / 3);
            const year = new Date().getFullYear();

            const body = [
              '## Quarterly Maintenance - Q' + quarter + ' ' + year,
              '',
              '### Dependencies',
              '',
              '```sh',
              'bun outdated',
              'bun audit',
              '```',
              '',
              '- [ ] Review major version updates',
              '- [ ] Update SolidStart (currently alpha — check for stable release)',
              '- [ ] Update SvelteKit / Svelte',
              '- [ ] Update better-auth',
              '- [ ] Update Storyblok SDK',
              '- [ ] Run `bun audit` and fix any high/critical vulnerabilities',
              '',
              '### Infrastructure',
              '',
              '- [ ] Check Docker base image versions (postgres, caddy, bun)',
              '- [ ] Review VPS memory usage — OOM caused data loss before',
              '- [ ] Verify daily postgres backup is running (`crontab -l` on VPS)',
              '- [ ] Test backup restore works',
              '',
              '### Content',
              '',
              '- [ ] Remove outdated events/campaigns in Storyblok',
              '- [ ] Update "Our Work" with recent projects',
              '- [ ] Verify all links work',
              '- [ ] Check copyright year',
              '',
              '### Verification',
              '',
              '- [ ] https://y4h.org — public site',
              '- [ ] https://preview.y4h.org — preview site',
              '- [ ] https://y4h.org/admin — admin panel',
              '- [ ] Shortlinks working (y4h.link)',
              '- [ ] Mobile view',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Quarterly Maintenance - Q' + quarter + ' ' + year,
              body,
            });

  yearly-reminder:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 1 1 *' || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Create Yearly Maintenance Issue
        uses: actions/github-script@v7
        with:
          script: |
            const year = new Date().getFullYear();

            const body = [
              '## Annual Maintenance - ' + year,
              '',
              '### Dependency Audit',
              '',
              '```sh',
              'bun outdated',
              'bun audit',
              '```',
              '',
              '- [ ] All major version updates reviewed',
              '- [ ] SolidStart stable release available? Upgrade if so',
              '- [ ] Node/Bun engine versions still appropriate',
              '',
              '### Security Review',
              '',
              '- [ ] Rotate BETTER_AUTH_SECRET',
              '- [ ] Rotate Storyblok tokens',
              '- [ ] Rotate SHLINK_API_KEY',
              '- [ ] Review GitHub Actions secrets — remove stale ones',
              '- [ ] Review VPS SSH authorized_keys',
              '- [ ] `bun audit` — no high/critical vulnerabilities',
              '',
              '### Infrastructure Review',
              '',
              '- [ ] VPS plan still appropriate for usage?',
              '- [ ] Postgres backups healthy (check /home/deploy/backups/)',
              '- [ ] Docker volumes healthy',
              '- [ ] Hetzner backups enabled',
              '- [ ] SSL certificates auto-renewing (Caddy handles this)',
              '',
              '### Access Review',
              '',
              '- [ ] GitHub repo collaborators',
              '- [ ] Hetzner account access',
              '- [ ] Storyblok users',
              '- [ ] Remove access for anyone no longer involved',
              '',
              '### Verification',
              '',
              '- [ ] Full smoke test of public site',
              '- [ ] Full smoke test of admin panel',
              '- [ ] Shortlinks working',
              '- [ ] Email/Listmonk working',
              '- [ ] Analytics working (Umami)',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Annual Maintenance - ' + year,
              body,
            });
