name: Deploy Admin

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'infra/docker-compose.yml'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  ADMIN_IMAGE: ghcr.io/crackrepacktorrent/yah/admin

jobs:
  check:
    if: github.event_name == 'push'
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ env.ADMIN_IMAGE }}:latest,${{ env.ADMIN_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          TAG: ${{ inputs.image_tag || 'latest' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG
          script: |
            set -e
            cd /home/deploy/yah
            git pull origin main
            cd infra
            ADMIN_TAG=$TAG docker compose pull yah-admin
            ADMIN_TAG=$TAG docker compose up -d yah-admin
            docker image prune -f

      - name: Verify deployment
        run: |
          sleep 10
          curl -sf --retry 3 --retry-delay 5 https://admin.y4h.org/login || exit 1
