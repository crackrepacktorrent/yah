name: Deploy Admin

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/admin-core/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Exact image tag to deploy (defaults to this workflow commit SHA)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  ADMIN_IMAGE: ghcr.io/crackrepacktorrent/yah/admin

jobs:
  check:
    if: github.event_name == 'push'
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ env.ADMIN_IMAGE }}:latest,${{ env.ADMIN_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: production-vps
      cancel-in-progress: false
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          TAG: ${{ inputs.image_tag || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG
          script: |
            set -e
            exec 9>/home/deploy/yah/.production-deploy.lock
            flock --timeout 900 9
            cd /home/deploy/yah
            git pull --ff-only origin main
            cd infra
            ADMIN_TAG=$TAG docker compose pull yah-admin
            # Fail closed before replacing the running admin. The first strict-
            # verification rollout intentionally stops here until the attested
            # owner operation in docs/admin-stabilization.md has been completed.
            ADMIN_TAG=$TAG docker compose run --rm --no-deps yah-admin bun ops/audit-auth.js
            ADMIN_TAG=$TAG docker compose up -d --no-deps --pull never --wait yah-admin

      - name: Verify deployment
        run: |
          sleep 10
          curl -sf --retry 3 --retry-delay 5 https://admin.y4h.org/api/health || exit 1
