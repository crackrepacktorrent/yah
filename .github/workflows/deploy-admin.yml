name: Deploy Admin

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'infra/docker-compose.yml'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ADMIN_IMAGE: ghcr.io/crackrepacktorrent/yah/admin

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ env.ADMIN_IMAGE }}:latest,${{ env.ADMIN_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/yah
            git pull origin main
            cd infra
            docker compose pull yah-admin
            docker compose up -d yah-admin
            docker image prune -f
