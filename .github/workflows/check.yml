name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, vps-migration]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Sync SvelteKit
        run: npx svelte-kit sync

      - name: Run svelte-check
        run: npx svelte-check --tsconfig ./tsconfig.json

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-placeholder
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgres://localhost/ci
          SHLINK_API_KEY: ci-placeholder
          SHLINK_URL: http://localhost:8080
