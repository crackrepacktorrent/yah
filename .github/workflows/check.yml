name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    name: Check, lint, and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: yah_admin_v2_test
          POSTGRES_USER: yah
          POSTGRES_PASSWORD: yah-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yah -d yah_admin_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run lint

      - run: bun run test

      - name: Bootstrap disposable auth database
        run: bun run --cwd apps/admin ops:bootstrap-admin
        env:
          DATABASE_URL: postgres://yah:yah-ci-only@127.0.0.1:5432/yah_admin_v2_test
          BETTER_AUTH_SECRET: yah-ci-auth-secret-at-least-32-characters
          BOOTSTRAP_ADMIN_EMAIL: owner-one@example.test
          BOOTSTRAP_ADMIN_NAME: CI Owner
          BOOTSTRAP_ADMIN_PASSWORD: owner-one-test-password-2026

      - name: Test Solid 2 production auth and authorization
        run: bun run --cwd apps/admin test:auth-integration
        env:
          ADMIN_V2_AUTH_INTEGRATION: '1'
          ADMIN_V2_AUTH_INTEGRATION_CONFIRMATION: mutate-and-clean-disposable-auth-database
          ADMIN_V2_RUNTIME: production
          DATABASE_URL: postgres://yah:yah-ci-only@127.0.0.1:5432/yah_admin_v2_test
          BETTER_AUTH_SECRET: yah-ci-auth-secret-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:43123
          PUBLIC_SITE_URL: https://www.example.test
          LISTMONK_URL: https://mail.example.test
          LISTMONK_API_TOKEN: admin:test
          LISTMONK_ADMIN_ACCESS_TEMPLATE_ID: '1'
          LISTMONK_INVITATION_TEMPLATE_ID: '2'
          LISTMONK_PASSWORD_RESET_TEMPLATE_ID: '3'
          SHLINK_URL: https://links.example.test
          SHLINK_API_KEY: test
          UMAMI_URL: https://analytics.example.test
          UMAMI_USERNAME: test
          UMAMI_PASSWORD: test
          UMAMI_WEBSITE_ID: test

      - run: bun run --cwd apps/admin install:e2e

      - run: bun run test:e2e:admin

      - name: Test Solid 2 production routes in a real browser
        run: bun run --cwd apps/admin test:e2e:production
        env:
          ADMIN_V2_RUNTIME: production
          ADMIN_V2_PRODUCTION_E2E_CONFIRMATION: mutate-and-clean-disposable-production-e2e-database
          DATABASE_URL: postgres://yah:yah-ci-only@127.0.0.1:5432/yah_admin_v2_test
          BETTER_AUTH_SECRET: yah-ci-auth-secret-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:43123
          PUBLIC_SITE_URL: https://www.example.test
          LISTMONK_URL: https://mail.example.test
          LISTMONK_API_TOKEN: admin:test
          LISTMONK_ADMIN_ACCESS_TEMPLATE_ID: '1'
          LISTMONK_INVITATION_TEMPLATE_ID: '2'
          LISTMONK_PASSWORD_RESET_TEMPLATE_ID: '3'
          SHLINK_URL: https://links.example.test
          SHLINK_API_KEY: test
          UMAMI_URL: https://analytics.example.test
          UMAMI_USERNAME: test
          UMAMI_PASSWORD: test
          UMAMI_WEBSITE_ID: test
