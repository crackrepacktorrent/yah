name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'infra/docker-compose.yml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/check.yml
  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/yah
            git pull origin main
            cd infra
            docker compose build sveltekit sveltekit-preview
            docker compose up -d sveltekit sveltekit-preview
            docker image prune -f
