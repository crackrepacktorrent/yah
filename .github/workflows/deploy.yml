name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    uses: ./.github/workflows/check.yml
  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/yah
            git pull origin main
            cd /home/deploy/yah-infra
            # Build sequentially — parallel builds OOM on 4GB VPS
            docker compose build sveltekit
            docker compose build sveltekit-preview
            docker compose up -d
            docker image prune -f
