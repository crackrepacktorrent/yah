services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sveltekit
      - shlink
      - umami

  sveltekit:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: 3000
      ORIGIN: https://y4h.org
      PROTOCOL_HEADER: X-Forwarded-Proto
      HOST_HEADER: X-Forwarded-Host
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

  sveltekit-preview:
    build: .
    restart: unless-stopped
    env_file: .env.preview
    environment:
      PORT: 3001
      ORIGIN: https://preview.y4h.org
      PROTOCOL_HEADER: X-Forwarded-Proto
      HOST_HEADER: X-Forwarded-Host
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy

  shlink:
    image: shlinkio/shlink:4
    restart: unless-stopped
    environment:
      DEFAULT_DOMAIN: y4h.link
      IS_HTTPS_ENABLED: "true"
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shlink
      DB_USER: shlink
      DB_PASSWORD: ${SHLINK_DB_PASSWORD}
      INITIAL_API_KEY: ${SHLINK_API_KEY}
      GEOLITE_LICENSE_KEY: ${GEOLITE_LICENSE_KEY:-}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

  listmonk:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
    expose:
      - "9000"
    volumes:
      - ./config/listmonk-prod.toml:/listmonk/config.toml:ro
    command: "./listmonk --config /listmonk/config.toml"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      SHLINK_DB_PASSWORD: ${SHLINK_DB_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD}
      YAH_DB_PASSWORD: ${YAH_DB_PASSWORD}
      LISTMONK_DB_PASSWORD: ${LISTMONK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-prod-db.sh:/docker-entrypoint-initdb.d/init-prod-db.sh:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
